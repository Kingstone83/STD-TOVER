<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TOVER STD2</title>
    <link rel="stylesheet" href="assets/styles.css?v=7" />
  </head>
  <body>
    <main class="app-shell">
      <section class="search-panel" aria-label="Ricerca schede tecniche">
        <div class="brand">
          <div>
            <p class="eyebrow">Archivio STD</p>
            <h1>TOVER STD2</h1>
          </div>
          <span class="count" id="countBadge">0 PDF</span>
        </div>

        <label class="search-box" for="searchInput">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m21 21-4.3-4.3m1.3-5.2a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" />
          </svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Scrivi il nome del prodotto" />
        </label>

        <div class="toolbar">
          <button class="filter is-active" type="button" data-filter="all">Tutte</button>
          <button class="filter" type="button" data-filter="current">In listino</button>
          <button class="filter" type="button" data-filter="out">Fuori listino</button>
        </div>

        <label class="category-filter" for="categorySelect">
          <span>Categoria</span>
          <select id="categorySelect">
            <option value="all">Tutte le categorie</option>
          </select>
        </label>

        <section class="advisor" aria-label="Consulente tecnico">
          <div class="advisor-heading">
            <span>Consulente</span>
            <small>basato sulle schede</small>
          </div>
          <textarea id="advisorQuestion" rows="3" placeholder="Es. cosa uso per incollare parquet su massetto umido?"></textarea>
          <div class="advisor-actions">
            <button class="advisor-button" type="button" id="advisorButton">Rispondi</button>
            <button class="advisor-clear" type="button" id="advisorClear">Pulisci</button>
          </div>
          <div class="advisor-answer" id="advisorAnswer" aria-live="polite"></div>
        </section>

        <div class="result-meta" id="resultMeta">Caricamento schede...</div>
        <div class="results" id="results" aria-live="polite"></div>
      </section>

      <section class="viewer-panel" aria-label="Anteprima scheda tecnica">
        <div class="viewer-header">
          <div class="viewer-title">
            <p id="viewerFolder">Seleziona una scheda</p>
            <h2 id="viewerName">Anteprima PDF</h2>
          </div>
          <div class="viewer-actions">
            <a class="icon-button" id="openButton" href="#" target="_blank" rel="noreferrer" aria-label="Apri in nuova finestra" title="Apri">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M15 3h6v6m-1-5-9 9M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
              </svg>
            </a>
            <a class="download-button" id="downloadButton" href="#" download>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16" />
              </svg>
              Scarica
            </a>
          </div>
        </div>

        <div class="empty-view" id="emptyView">
          <div class="file-icon" aria-hidden="true">PDF</div>
          <p>Cerca un prodotto e seleziona la scheda per visualizzarla qui.</p>
        </div>

        <div class="preview-wrap" id="previewWrap">
          <img id="previewImage" alt="Anteprima scheda tecnica" />
          <iframe id="pdfFrame" title="Anteprima scheda tecnica"></iframe>
        </div>
      </section>
    </main>

    <script src="assets/app.js?v=6" type="module"></script>
  </body>
</html>
