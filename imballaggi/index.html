<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schede Imballaggio</title>
    <link rel="stylesheet" href="assets/styles.css?v=1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="finder" aria-label="Ricerca schede imballaggio">
        <header class="brand">
          <div>
            <p class="eyebrow">Archivio imballaggi</p>
            <h1>Schede prodotto</h1>
          </div>
          <span class="count" id="countBadge">0 schede</span>
        </header>

        <label class="search-box" for="searchInput">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m21 21-4.3-4.3m1.3-5.2a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" />
          </svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Cerca prodotto, codice, imballo o cliente" />
        </label>

        <div class="filters">
          <label for="sourceFilter">
            <span>Archivio</span>
            <select id="sourceFilter">
              <option value="all">Tutti</option>
              <option value="tover">TOVER</option>
              <option value="cliente">Marchio cliente</option>
            </select>
          </label>

          <label for="categoryFilter">
            <span>Categoria</span>
            <select id="categoryFilter">
              <option value="all">Tutte le categorie</option>
            </select>
          </label>

          <label for="clientFilter">
            <span>Cliente</span>
            <select id="clientFilter">
              <option value="all">Tutti i clienti</option>
            </select>
          </label>
        </div>

        <div class="result-meta" id="resultMeta">Caricamento dati...</div>
        <div class="results" id="results" aria-live="polite"></div>
      </section>

      <section class="product-page" id="productPage" aria-label="Scheda prodotto">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon" aria-hidden="true">IMB</div>
          <p>Cerca un prodotto e seleziona una scheda per vedere imballi, codici e formati.</p>
        </div>
      </section>
    </main>

    <script src="assets/app.js?v=1" type="module"></script>
  </body>
</html>
